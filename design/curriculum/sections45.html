<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outcomes and Compare Versions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Layout: ten candidate sections (five per block), each at the page's 1040px measure, dark palette, gold only where something must stand out. */
:root{
  color-scheme:dark;
  --bg:#05070A;--bg2:#070A10;--panel:#0C0E12;--panel2:#0A0C10;--ink:#141005;--gold:#FFC72C;--gold-dim:rgba(255,199,44,.5);--red:#F2777B;
  --t-strong:#fff;--t-read:#E6ECF2;--t-soft:#A3AEB9;--t-mute:#8E9AA6;--hair:rgba(255,255,255,.09);
  --display:'Bricolage Grotesque',system-ui,sans-serif;--sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--t-strong);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h2,h3,p,ul,ol,li{margin:0;padding:0}
ul,ol{list-style:none}
.gold{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- review chrome ---------- */
.rv{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 20px;background:rgba(5,7,10,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.rv__t{font:700 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--t-mute);white-space:nowrap}
.rv__nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.rv__nav::-webkit-scrollbar{display:none}
.rv__nav a{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--hair);color:#fff;text-decoration:none;font:600 13px/1 var(--sans);white-space:nowrap}
.rv__nav a b{display:inline-grid;place-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--gold);color:var(--ink);font:800 11px/1 var(--sans)}
.rv__nav a:hover{border-color:rgba(255,199,44,.6)}
.tag{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;max-width:1040px;margin:0 auto}
.tag span{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:rgba(255,199,44,.08);border:1px solid rgba(255,199,44,.3);font:700 13px/1 var(--sans)}
.tag span b{display:inline-grid;place-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--gold);color:var(--ink);font:800 11px/1 var(--sans)}
.tag em{font:500 13px/1.3 var(--sans);font-style:normal;color:var(--t-mute)}

/* ---------- section shell (matches the page) ---------- */
.v{position:relative;padding:clamp(56px,7vw,88px) 24px clamp(72px,8vw,104px);border-top:1px solid var(--hair)}
.v:nth-of-type(even){background:var(--bg2)}
.head{max-width:960px;margin:clamp(24px,3vw,36px) auto 0;text-align:center}
.h2{font:800 clamp(30px,3.4vw,48px)/1.08 var(--display);letter-spacing:-.028em;text-wrap:balance}
.muted{color:var(--t-mute)}
.wrap{max-width:1040px;margin:clamp(36px,4.5vw,52px) auto 0}
.title{font:800 clamp(17px,1.5vw,20px)/1.22 var(--display);letter-spacing:-.015em;color:#fff;text-wrap:balance}
.copy{font:500 clamp(15px,1.15vw,16.5px)/1.58 var(--sans);color:var(--t-read);text-wrap:pretty}
.num{font:800 12px/1 var(--sans);letter-spacing:.18em;color:var(--gold)}
.tick,.cross{flex:none;display:grid;place-items:center;font:800 11px/1 var(--sans)}
.tick{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--ink)}
.cross{width:22px;height:22px;border-radius:50%;background:rgba(242,119,123,.14);color:var(--red)}

/* ===== S4·A Ledger: numbered rows, hairlines, title column + copy column ===== */
.ledger{border-top:1px solid var(--hair)}
.ledger li{display:grid;grid-template-columns:56px minmax(0,.8fr) minmax(0,1.3fr);gap:16px clamp(20px,3vw,44px);align-items:baseline;padding:22px 0;border-bottom:1px solid var(--hair)}
.ledger .num{font-size:14px}

/* ===== S4·B Grid lines: 3×2 cells divided by rules, gold square bullet ===== */
.gridl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--hair);border-radius:18px;overflow:hidden;background:var(--panel2)}
.gridl li{display:flex;flex-direction:column;gap:10px;padding:clamp(22px,2.4vw,30px);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.gridl li:nth-child(3n){border-right:0}
.gridl li:nth-last-child(-n+3){border-bottom:0}
.gridl .sq{width:10px;height:10px;border-radius:2px;background:var(--gold);margin-bottom:4px}

/* ===== S4·C Checklist panel: one panel, six rows, square gold checkboxes ===== */
.check{border:1px solid var(--hair);border-radius:20px;background:var(--panel);overflow:hidden}
.check li{display:grid;grid-template-columns:30px minmax(0,.8fr) minmax(0,1.3fr);gap:14px clamp(18px,2.6vw,36px);align-items:start;padding:20px clamp(20px,2.6vw,32px)}
.check li+li{border-top:1px solid var(--hair)}
.check li:nth-child(even){background:rgba(255,255,255,.02)}
.check .box{width:26px;height:26px;border-radius:7px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:800 13px/1 var(--sans);margin-top:-2px}

/* ===== S4·D Bento: four compact, the two payoffs wide and gold-edged ===== */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bento li{display:flex;flex-direction:column;gap:8px;padding:clamp(20px,2.2vw,26px);border-radius:18px;border:1px solid var(--hair);background:var(--panel2)}
.bento li.big{grid-column:span 1;border-color:rgba(255,199,44,.45);background:linear-gradient(135deg,rgba(255,199,44,.09),rgba(255,199,44,.02) 60%,var(--panel2))}
.bento .num{margin-bottom:2px}
.bento li.big .title{font-size:clamp(19px,1.7vw,23px)}
.bento li.big .num{color:var(--ink);background:var(--gold);align-self:flex-start;padding:5px 8px;border-radius:5px;letter-spacing:.1em}

/* ===== S4·E Rail: gold spine, numbered nodes, text flowing right ===== */
.rail{position:relative;padding-left:48px}
.rail::before{content:"";position:absolute;left:14px;top:10px;bottom:10px;width:2px;background:linear-gradient(180deg,var(--gold),rgba(255,199,44,.15))}
.rail li{position:relative;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr);gap:8px clamp(20px,3vw,44px);align-items:baseline;padding:10px 0 30px}
.rail li::before{content:attr(data-n);position:absolute;left:-48px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:800 12px/1 var(--sans)}
.rail li:last-child{padding-bottom:0}
.rail li:last-child::before{background:var(--gold);color:var(--ink)}

/* ===== S5·A Paired rows: pain → gain on one line, gold arrow ===== */
.pairs{border-top:1px solid var(--hair)}
.pairs .hd{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);padding:14px 0 12px}
.pairs .hd span{font:800 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--t-mute)}
.pairs .hd span:last-child{color:var(--gold)}
.pairs li{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);align-items:center;padding:18px 0;border-top:1px solid var(--hair)}
.pairs .now{font:500 clamp(15px,1.15vw,16.5px)/1.5 var(--sans);color:var(--t-mute)}
.pairs .arrow{justify-self:center;width:30px;height:30px;border-radius:50%;background:rgba(255,199,44,.12);color:var(--gold);display:grid;place-items:center;font:800 14px/1 var(--sans)}
.pairs .fri{font:600 clamp(15px,1.15vw,16.5px)/1.5 var(--sans);color:#fff}

/* ===== S5·B Two cards: Right Now recedes, By Friday steps forward ===== */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.two .card{border-radius:20px;padding:clamp(22px,2.6vw,32px);border:1px solid var(--hair);background:var(--panel2)}
.two .card.after{border-color:var(--gold);background:linear-gradient(160deg,rgba(255,199,44,.1),rgba(255,199,44,.02) 55%,var(--panel2));transform:translateY(-10px)}
.two .lbl{font:800 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--t-mute);margin-bottom:18px}
.two .after .lbl{color:var(--gold)}
.two li{display:flex;gap:12px;align-items:flex-start;font:500 clamp(15px,1.15vw,16.5px)/1.5 var(--sans);color:var(--t-soft)}
.two li+li{margin-top:14px}
.two .after li{color:#fff;font-weight:600}
.two .cross,.two .tick{margin-top:1px}

/* ===== S5·C Strike-through: each pain crossed out, its gain underneath ===== */
.strike{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.strike li{display:flex;flex-direction:column;gap:8px;padding:clamp(18px,2vw,24px);border-radius:16px;border:1px solid var(--hair);background:var(--panel2)}
.strike .now{font:500 15px/1.45 var(--sans);color:var(--t-mute);text-decoration:line-through;text-decoration-color:rgba(242,119,123,.7);text-decoration-thickness:1.5px}
.strike .fri{display:flex;gap:10px;align-items:flex-start;font:600 clamp(15px,1.15vw,16.5px)/1.5 var(--sans);color:#fff}
.strike .fri .tick{margin-top:1px}

/* ===== S5·D Table: topic label, then before/after ===== */
.tbl{border:1px solid var(--hair);border-radius:18px;overflow:hidden;background:var(--panel2)}
.tbl .row{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);gap:0 clamp(16px,2vw,28px);padding:16px clamp(18px,2.4vw,28px)}
.tbl .row+.row{border-top:1px solid var(--hair)}
.tbl .row.hd{background:rgba(255,255,255,.03);padding-top:12px;padding-bottom:12px}
.tbl .hd span{font:800 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--t-mute)}
.tbl .hd span:last-child{color:var(--gold)}
.tbl .topic{font:800 12px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding-top:3px}
.tbl .now{font:500 15px/1.5 var(--sans);color:var(--t-mute)}
.tbl .fri{font:600 15px/1.5 var(--sans);color:#fff;position:relative;padding-left:14px}
.tbl .fri::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--gold)}

/* ===== S5·E Toggle: one list, flip between states ===== */
.tog{max-width:760px;margin-left:auto;margin-right:auto}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;position:relative;margin:0 auto 22px;padding:5px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--hair);left:50%;transform:translateX(-50%)}
.seg i{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background:rgba(255,255,255,.14);transition:transform .4s cubic-bezier(.2,.7,.2,1),background .4s}
.seg[data-on="1"] i{transform:translateX(100%);background:var(--gold)}
.seg button{position:relative;appearance:none;border:0;background:none;cursor:pointer;padding:12px 26px;font:700 15px/1 var(--sans);color:var(--t-mute);transition:color .3s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:#fff}
.seg[data-on="1"] button[aria-pressed="true"]{color:var(--ink)}
.tog .list{border:1px solid var(--hair);border-radius:18px;background:var(--panel2);padding:6px clamp(18px,2.4vw,28px)}
.tog li{display:flex;gap:12px;align-items:flex-start;padding:15px 0;font:500 clamp(15px,1.15vw,16.5px)/1.5 var(--sans);color:var(--t-soft)}
.tog li+li{border-top:1px solid var(--hair)}
.tog[data-state="1"] li{color:#fff;font-weight:600}
.tog[data-state="1"] .list{border-color:rgba(255,199,44,.5)}
.tog .cross{display:grid}.tog .tick{display:none}
.tog[data-state="1"] .cross{display:none}.tog[data-state="1"] .tick{display:grid}

@media (max-width:860px){
  .ledger li,.check li,.rail li{grid-template-columns:1fr;gap:6px}
  .ledger li{grid-template-columns:48px minmax(0,1fr)}.ledger .copy{grid-column:2}
  .check li{grid-template-columns:30px minmax(0,1fr)}.check .copy{grid-column:2}
  .gridl{grid-template-columns:1fr}.gridl li{border-right:0;border-bottom:1px solid var(--hair)}.gridl li:last-child{border-bottom:0}
  .bento,.strike{grid-template-columns:1fr}
  .pairs .hd{display:none}.pairs li{grid-template-columns:1fr;gap:10px}.pairs .arrow{justify-self:start;transform:rotate(90deg)}
  .two{grid-template-columns:1fr}.two .card.after{transform:none}
  .tbl .row{grid-template-columns:1fr;gap:8px}.tbl .row.hd{display:none}
}
@media (max-width:640px){.v{padding-left:16px;padding-right:16px}.rv__t{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav class="rv" aria-label="Versions">
  <span class="rv__t">Sections 4 and 5 · 5 versions each</span>
  <div class="rv__nav" data-nav></div>
</nav>
<div data-root></div>
<script>
(() => {
  'use strict';
  const WA = [
    ['A filter that shows you only the A+ setups','Fifteen order blocks and FVGs on your chart, and in under a minute you know which ones have real odds behind them and which are traps. You only risk money on A+ trades from now on.'],
    ['Your daily bias called before the open','You read where price is reaching before the market opens and know buy day or sell day, with a reason behind it. You’re positioned before the move instead of chasing it.'],
    ['The confidence to pull the trigger','When the 3 DRT checks line up, the decision is made for you. No waiting for one more candle, no watching your own setup run without you. You click, you manage, you trust the process.'],
    ['Consistency you can count on','Same process, same way, every session. Your results finally match the hours you put in, and the account grows week after week instead of green one week, red the next.'],
    ['Pass the prop challenge and keep the account','A challenge is just another trading week when you only take A+ trades with defined risk. Pass it, get funded, keep it, and scale into account sizes you could never afford on your own.'],
    ['Time and financial freedom, on your terms','A second income around the job first. Then an income that matches it. Then, for the ones who want it, the day you hand in your notice and trade for a living, with your mornings and evenings back.']
  ];
  const NOW = ['Fifteen setups screaming at you and no way to tell which one is real','A new ICT model every week, back to square one every Monday','Guessing daily bias and finding out which way it went after the move','Three hours on the charts and a flat account to show for it','Profitable some weeks, can’t make it stick','Wondering if you’re just not built for this'];
  const FRI = ['One filter that tells you which ICT setup to take and which to skip, in under a minute','One process you run every session, so every week builds on the last','Your bias called before the open, with a reason you can say out loud','One trade, 30 minutes, laptop shut, evenings back','Green weeks that stack, the kind you pass a challenge with and keep','A written plan in your hand and the calm of finally knowing why'];
  const TOPIC = ['Setups','Process','Bias','Time','Results','Mindset'];
  const pad = n => String(n).padStart(2, '0');
  const H4 = '<h2 class="h2">What You’ll Walk Away With <span class="gold">After 5 Days</span></h2>';
  const H5 = '<h2 class="h2">Your ICT Trading <span class="muted">Right Now</span> vs. <span class="gold">After The 5-Day Challenge</span></h2>';
  const tick = '<span class="tick">✓</span>', cross = '<span class="cross">✕</span>';

  const S4 = {
    A: ['Ledger', 'Numbered rows on hairlines. The gold numeral and bold title carry it.',
      `<ol class="ledger">${WA.map(([t, c], i) => `<li><span class="num">${pad(i + 1)}</span><h3 class="title">${t}</h3><p class="copy">${c}</p></li>`).join('')}</ol>`],
    B: ['Grid lines', 'Three by two, divided by rules instead of cards. A gold square marks each.',
      `<ul class="gridl">${WA.map(([t, c]) => `<li><span class="sq"></span><h3 class="title">${t}</h3><p class="copy">${c}</p></li>`).join('')}</ul>`],
    C: ['Checklist', 'One panel, six ticked rows, alternating tint.',
      `<ol class="check">${WA.map(([t, c]) => `<li><span class="box">✓</span><h3 class="title">${t}</h3><p class="copy">${c}</p></li>`).join('')}</ol>`],
    D: ['Bento', 'Four compact tiles; the two payoffs (funded, freedom) get the gold edge.',
      `<ul class="bento">${WA.map(([t, c], i) => `<li class="${i >= 4 ? 'big' : ''}"><span class="num">${pad(i + 1)}</span><h3 class="title">${t}</h3><p class="copy">${c}</p></li>`).join('')}</ul>`],
    E: ['Rail', 'A gold spine with numbered nodes; the last node fills in.',
      `<ol class="rail">${WA.map(([t, c], i) => `<li data-n="${i + 1}"><h3 class="title">${t}</h3><p class="copy">${c}</p></li>`).join('')}</ol>`]
  };
  const S5 = {
    A: ['Paired rows', 'Each pain on the left, its fix on the right, joined by a gold arrow.',
      `<div class="pairs"><div class="hd"><span>Right Now</span><span></span><span>By Friday</span></div><ul>${NOW.map((n, i) => `<li><span class="now">${n}</span><span class="arrow">→</span><span class="fri">${FRI[i]}</span></li>`).join('')}</ul></div>`],
    B: ['Two cards', 'Right Now sits back; By Friday steps forward with a gold border.',
      `<div class="two"><div class="card"><div class="lbl">Right Now</div><ul>${NOW.map(n => `<li>${cross}<span>${n}</span></li>`).join('')}</ul></div><div class="card after"><div class="lbl">By Friday</div><ul>${FRI.map(n => `<li>${tick}<span>${n}</span></li>`).join('')}</ul></div></div>`],
    C: ['Strike-through', 'Six tiles. The old line is crossed out; the new line sits under it.',
      `<ul class="strike">${NOW.map((n, i) => `<li><span class="now">${n}</span><span class="fri">${tick}<span>${FRI[i]}</span></span></li>`).join('')}</ul>`],
    D: ['Table', 'A topic label per row, then before and after. The after column has a gold rule.',
      `<div class="tbl"><div class="row hd"><span>Topic</span><span>Right Now</span><span>By Friday</span></div>${NOW.map((n, i) => `<div class="row"><span class="topic">${TOPIC[i]}</span><span class="now">${n}</span><span class="fri">${FRI[i]}</span></div>`).join('')}</div>`],
    E: ['Toggle', 'One list that flips between the two states.',
      `<div class="tog" data-state="0"><div class="seg" data-on="0" role="group" aria-label="State"><i aria-hidden="true"></i><button type="button" data-s="0" aria-pressed="true">Right Now</button><button type="button" data-s="1" aria-pressed="false">By Friday</button></div><ul class="list">${NOW.map((n, i) => `<li>${cross}${tick}<span data-now="${n}" data-fri="${FRI[i]}">${n}</span></li>`).join('')}</ul></div>`]
  };

  const root = document.querySelector('[data-root]'), nav = document.querySelector('[data-nav]');
  const block = (key, head, defs, label) => Object.entries(defs).map(([k, [name, hint, html]]) => {
    const id = `${key}${k}`;
    nav.insertAdjacentHTML('beforeend', `<a href="#${id}"><b>${id.toUpperCase()}</b>${name}</a>`);
    return `<section class="v" id="${id}"><div class="tag"><span><b>${label} · ${k}</b>${name}</span><em>${hint}</em></div><header class="head">${head}</header><div class="wrap">${html}</div></section>`;
  }).join('');
  root.innerHTML = block('s4', H4, S4, 'Section 4') + block('s5', H5, S5, 'Section 5');

  // Toggle (S5·E)
  const tog = document.querySelector('.tog');
  tog.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s; tog.dataset.state = s; tog.querySelector('.seg').dataset.on = s;
    tog.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    tog.querySelectorAll('li > span[data-now]').forEach(sp => { sp.textContent = s === '1' ? sp.dataset.fri : sp.dataset.now; });
  }));
})();
</script>
</body>
</html>
