<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare · 10 versions</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Section 5, Kunal 7 Oct 2026: "love this but … a bit gimmicky and not professional … keep it like this … 3 versions".
   Same layout as the page (heading, two cards with item n level across both, one screen, the button), with the loud parts
   gone: no gold-filled card, no highlighter box on the heading, no blue-ringed VS, one accent colour. */
:root{--gold:#FFC72C;--display:'Bricolage Grotesque',system-ui,sans-serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#05070A;color:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}
h2,h3,p{margin:0}
.rv{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 24px;background:rgba(5,7,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.rv span{font:700 14px/1 var(--sans);color:#8E9AA6}
.rv a{padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.09);color:#fff;text-decoration:none;font:600 13px/1 var(--sans)}
.rv a b{color:var(--gold);margin-right:6px}
.note{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:baseline;font:500 15px/1.4 var(--sans);color:#A3AEB9}
.note b{flex:none;padding:7px 11px;border-radius:6px;background:var(--gold);color:#141005;font:800 14px/1 var(--display)}

/* the layout, as on the page */
.vsec{display:flex;flex-direction:column;gap:0;padding:clamp(72px,8vw,112px) 24px;background:#070A10;border-bottom:1px solid rgba(255,255,255,.08)}
.vsec .note{margin-bottom:40px}
.vsec h2{margin:0 auto;max-width:960px;text-align:center;font:800 clamp(34px,3.5vw,52px)/1.08 var(--display);letter-spacing:-.028em;text-wrap:balance}
.vs{position:relative;width:100%;max-width:1040px;margin:clamp(40px,5vw,56px) auto 0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto repeat(6,auto);column-gap:var(--gap,24px)}
.card{--py:30px;--px:32px;display:grid;grid-row:1/span 7;grid-template-rows:subgrid;row-gap:0;padding:var(--py) var(--px);border-radius:18px}
.lbl{margin:0 0 12px;padding-bottom:14px;font:800 30px/1 var(--display);letter-spacing:-.025em;border-bottom:1px solid}
.it{display:flex;gap:16px;align-items:center;padding:13px 2px;border-bottom:1px solid;font:500 16.5px/1.45 var(--sans);text-wrap:pretty}
.it:last-child{border-bottom:0}
.mk{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.mk svg{width:58%;height:58%;display:block}
.cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:clamp(48px,6vw,72px)}
.btn{width:min(480px,100%);display:flex;align-items:center;justify-content:center;background:#57B6F2;color:#03101C;font:800 21px/1 var(--display);letter-spacing:.045em;text-transform:uppercase;padding:21px 36px;border-radius:8px;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #2C82BD,0 12px 28px -16px rgba(0,0,0,.9)}
.cta small{font:400 15px/1 var(--sans);color:#9AA6B2}

/* 1 · Slate and ivory: Right Now in the day cards' slate, By Friday on ivory; gold is the only accent */
.v1 h2 .r{color:#E8737A}.v1 h2 .g{color:var(--gold)}
.v1 .now{background:linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border:1px solid rgba(255,255,255,.08)}
.v1 .now .lbl{color:#E8737A;border-color:rgba(232,115,122,.45)}
.v1 .now .it{color:#A3AEB9;border-color:rgba(255,255,255,.07)}
.v1 .now .mk{background:rgba(232,115,122,.12);color:#E8737A}
.v1 .fri{background:#F6F2E8}
.v1 .fri .lbl{color:#0B0D11;border-color:#C9A33A}
.v1 .fri .it{color:#12151A;font-weight:600;border-color:rgba(11,13,17,.1)}
.v1 .fri .mk{background:var(--gold);color:#141005}

/* 2 · All dark, gold frame: both cards in the page's dark, By Friday lifted by a gold hairline and a faint gold wash */
.v2 h2 .r{color:#E8737A}.v2 h2 .g{color:var(--gold)}
.v2 .now{background:linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border:1px solid rgba(255,255,255,.08)}
.v2 .now .lbl{color:#E8737A;border-color:rgba(255,255,255,.1)}
.v2 .now .it{color:#98A3AE;border-color:rgba(255,255,255,.06)}
.v2 .now .mk{background:rgba(232,115,122,.12);color:#E8737A}
.v2 .fri{background:linear-gradient(180deg,rgba(255,199,44,.07),rgba(255,199,44,.015) 60%),linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border:1px solid rgba(255,199,44,.5)}
.v2 .fri .lbl{color:var(--gold);border-color:rgba(255,199,44,.3)}
.v2 .fri .it{color:#fff;border-color:rgba(255,255,255,.07)}
.v2 .fri .mk{background:var(--gold);color:#141005}
.v2 .vsb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#0D121A;border:1px solid rgba(255,255,255,.14);font:700 16px/1 var(--display);color:#8E9AA6}

/* 3 · Paper: two light cards like a printed comparison, cool grey against white, navy text, gold ticks */
.v3 h2 .r{color:#E8737A}.v3 h2 .g{color:var(--gold)}
.v3 .vs{--gap:20px}
.v3 .now{background:#E7EAEE}
.v3 .now .lbl{color:#B8333E;border-color:rgba(11,18,32,.14)}
.v3 .now .it{color:#4A525C;border-color:rgba(11,18,32,.09)}
.v3 .now .mk{background:rgba(184,51,62,.1);color:#B8333E}
.v3 .fri{background:#fff;box-shadow:0 0 0 1px rgba(11,18,32,.06)}
.v3 .fri .lbl{color:#0B1B33;border-color:var(--gold);border-bottom-width:2px}
.v3 .fri .it{color:#0B1220;font-weight:600;border-color:rgba(11,18,32,.08)}
.v3 .fri .mk{background:#0B1B33;color:var(--gold)}

/* 4 · Framed pair (MK's red and green frames, grown up): both cards dark, a thin coloured frame and a top bar instead of
   neon borders; red for where you are, the page's own candle green for By Friday */
.v4 h2 .r{color:#E8737A}.v4 h2 .g{color:var(--gold)}
.v4 .card{border-radius:14px;background:linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border:1px solid}
.v4 .now{border-color:rgba(232,115,122,.38);box-shadow:inset 0 3px 0 #E8737A}
.v4 .fri{border-color:rgba(46,189,133,.4);box-shadow:inset 0 3px 0 #2EBD85}
.v4 .now .lbl{color:#E8737A;border-color:rgba(255,255,255,.08)}
.v4 .fri .lbl{color:#2EBD85;border-color:rgba(255,255,255,.08)}
.v4 .now .it{color:#A3AEB9;border-color:rgba(255,255,255,.06)}
.v4 .fri .it{color:#fff;border-color:rgba(255,255,255,.06)}
.v4 .now .mk{background:rgba(232,115,122,.12);color:#E8737A}
.v4 .fri .mk{background:rgba(46,189,133,.14);color:#2EBD85}

/* 5 · Paper and gold, numbered (MK's white and gold): Right Now on warm white with a black rule, By Friday on a flat,
   quieter gold with white numbered rows */
.v5 h2 .r{color:#E8737A}.v5 h2 .g{color:var(--gold)}
.v5 .card{border-radius:14px}
.v5 .now{background:#F7F6F2}
.v5 .now .lbl{color:#0B0D11;border-bottom:2px solid #0B0D11}
.v5 .now .it{color:#3A3F47;border-color:rgba(11,13,17,.1)}
.v5 .now .mk{background:transparent;color:#D6404C}
.v5 .now .mk svg{width:78%;height:78%}
.v5 .fri{background:#F2C14E;row-gap:clamp(6px,1vh,10px)}
.v5 .fri .lbl{color:#0B0D11;border-bottom:2px solid rgba(11,13,17,.85)}
.v5 .fri .it{color:#0B0D11;font-weight:600;background:#FFFDF6;border:0;border-radius:10px;padding-left:14px;padding-right:16px}
.v5 .fri .mk{background:#0B0D11;color:var(--gold);font:800 13px/1 var(--display);width:30px;height:30px}

/* 6 · Paper and slate, numbered (MK's white and dark): Right Now on warm white, By Friday on the day cards' slate in a
   thin gold frame, dark numbered rows with gold number squares */
.v6 h2 .r{color:#E8737A}.v6 h2 .g{color:var(--gold)}
.v6 .card{border-radius:14px}
.v6 .now{background:#F7F6F2}
.v6 .now .lbl{color:#0B0D11;border-bottom:2px solid #0B0D11}
.v6 .now .it{color:#3A3F47;border-color:rgba(11,13,17,.1)}
.v6 .now .mk{background:transparent;color:#D6404C}
.v6 .now .mk svg{width:78%;height:78%}
.v6 .fri{background:linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border:1px solid rgba(255,199,44,.55);row-gap:clamp(6px,1vh,10px)}
.v6 .fri .lbl{color:var(--gold);border-color:rgba(255,199,44,.3)}
.v6 .fri .it{color:#fff;font-weight:600;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding-left:14px;padding-right:16px}
.v6 .fri .mk{background:var(--gold);color:#141005;font:800 13px/1 var(--display);width:30px;height:30px}

/* 7 · Warm white and green (MK's white and green "Before / After Live Hypnosis"): Right Now on warm white under a red rule;
   By Friday on a deep, quieter green with white rows and dark tick squares */
.v7 h2 .r{color:#E8737A}.v7 h2 .g{color:var(--gold)}
.v7 .card{border-radius:14px}
.v7 .now{background:#F7F6F2}
.v7 .now .lbl{color:#D6404C;border-bottom:2px solid #D6404C}
.v7 .now .it{color:#3A3F47;border-color:rgba(11,13,17,.1)}
.v7 .now .mk{background:transparent;color:#D6404C}
.v7 .now .mk svg{width:78%;height:78%}
.v7 .fri{background:#1E8C61;row-gap:10px}
.v7 .fri .lbl{color:#fff;border-bottom:2px solid rgba(255,255,255,.85)}
.v7 .fri .it{color:#0B0D11;font-weight:600;background:#FBFCFA;border:0;border-radius:10px;padding-left:14px;padding-right:16px}
.v7 .fri .mk{background:#0B0D11;color:#3FD497}

/* 8 · One frame, a gold divide (MK's split panel): a single slate frame split down the middle by a gold line; Right Now in
   muted grey, By Friday in gold and white */
.v8 h2 .r{color:#E8737A}.v8 h2 .g{color:var(--gold)}
.v8 .vs{--gap:0px;background:radial-gradient(60% 50% at 85% 0%,rgba(255,199,44,.07),rgba(255,199,44,0) 70%),linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border:1px solid rgba(255,255,255,.08);border-radius:16px}
.v8 .card{background:transparent;border-radius:0}
.v8 .fri{border-left:2px solid var(--gold)}
.v8 .now .lbl{color:#8E9AA6;border-color:rgba(255,255,255,.08)}
.v8 .fri .lbl{color:var(--gold);border-color:rgba(255,255,255,.08)}
.v8 .now .it{color:#98A3AE;border-color:rgba(255,255,255,.06)}
.v8 .fri .it{color:#fff;font-weight:600;border-color:rgba(255,255,255,.06)}
.v8 .now .mk{background:transparent;color:#6B7682}
.v8 .fri .mk{background:transparent;color:var(--gold)}
.v8 .mk svg{width:80%;height:80%}

/* 9 · Tinted frames (MK's red and green frames with the glow at the top): slate cards in thin red and green frames, a faint
   wash of the same colour from the top corner instead of a glow */
.v9 h2 .r{color:#E8737A}.v9 h2 .g{color:var(--gold)}
.v9 .card{border-radius:14px;border:1px solid}
.v9 .now{background:radial-gradient(70% 45% at 15% 0%,rgba(232,115,122,.10),rgba(232,115,122,0) 70%),linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border-color:rgba(232,115,122,.45)}
.v9 .fri{background:radial-gradient(70% 45% at 15% 0%,rgba(46,189,133,.10),rgba(46,189,133,0) 70%),linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border-color:rgba(46,189,133,.5)}
.v9 .now .lbl{color:#E8737A;border-color:transparent}
.v9 .fri .lbl{color:#2EBD85;border-color:transparent}
.v9 .it{border-color:transparent}
.v9 .now .it{color:#A3AEB9}
.v9 .fri .it{color:#fff;font-weight:600}
.v9 .now .mk{background:transparent;color:#E8737A}
.v9 .fri .mk{background:transparent;color:#2EBD85}
.v9 .mk svg{width:80%;height:80%}

/* 10 · Header bars (MK's red and green title bars): slate cards with the label in a solid bar across the top, the colours
   a step deeper and quieter */
.v10 h2 .r{color:#E8737A}.v10 h2 .g{color:var(--gold)}
.v10 .card{border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#0E141B,#0D121A 45%,#0B0E14);border:1px solid rgba(255,255,255,.08)}
.v10 .fri{border-color:rgba(46,189,133,.55)}
.v10 .lbl{margin:calc(var(--py) * -1) calc(var(--px) * -1) 14px;padding:20px var(--px);border:0}
.v10 .now .lbl{background:#B8414A;color:#fff}
.v10 .fri .lbl{background:#1E8C61;color:#fff}
.v10 .it{border-color:rgba(255,255,255,.06)}
.v10 .now .it{color:#A3AEB9}
.v10 .fri .it{color:#fff;font-weight:600}
.v10 .now .mk{background:transparent;color:#E8737A}
.v10 .fri .mk{background:transparent;color:#2EBD85}
.v10 .mk svg{width:80%;height:80%}
</style>
</head>
<body>
<div class="rv"><span>Section 5 · 10 versions</span><a href="#v1"><b>1</b>Slate and ivory</a><a href="#v2"><b>2</b>All dark, gold frame</a><a href="#v3"><b>3</b>Paper</a><a href="#v4"><b>4</b>Framed pair</a><a href="#v5"><b>5</b>Paper and gold</a><a href="#v6"><b>6</b>Paper and slate</a><a href="#v7"><b>7</b>White and green</a><a href="#v8"><b>8</b>Gold divide</a><a href="#v9"><b>9</b>Tinted frames</a><a href="#v10"><b>10</b>Header bars</a></div>
<main data-root></main>
<script>
(() => {
  const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.5l3 3 6.2-6.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CROSS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const NOW = ['Fifteen setups screaming at you and no way to tell which one is real', 'A new ICT model every week, back to square one every Monday', 'Guessing daily bias and finding out which way it went after the move', 'Three hours on the charts and a flat account to show for it', 'Profitable some weeks, can’t make it stick', 'Wondering if you’re just not built for this'];
  const FRI = ['One filter that tells you which ICT setup to take and which to skip, in under a minute', 'One process you run every session, so every week builds on the last', 'Your bias called before the open, with a reason you can say out loud', 'One trade, 30 minutes, laptop shut, evenings back', 'Green weeks that stack, the kind you pass a challenge with and keep', 'A written plan in your hand and the calm of finally knowing why'];
  const V = [
    ['v1', 'Slate and ivory', 'Right Now sits back in the day cards’ slate; By Friday is the bright card, on ivory instead of gold fill. Gold is the only accent: the ticks and the heading. No VS badge, no highlighter box.', ''],
    ['v2', 'All dark, gold frame', 'Both cards in the page’s own dark. By Friday is set apart by a gold hairline and a faint gold wash, white text and gold ticks. A quiet vs in a hairline circle.', '<div class="vsb" aria-hidden="true">vs</div>'],
    ['v3', 'Paper', 'Two light cards side by side like a printed comparison: cool grey for Right Now, white for By Friday, navy type, gold ticks in navy squares. The most report-like.', ''],
    ['v4', 'Framed pair', 'From MK’s red and green frames, grown up: both cards dark, a thin coloured frame with a bar along the top instead of neon borders; red for where you are, the page’s own candle green for By Friday.', ''],
    ['v5', 'Paper and gold, numbered', 'From MK’s white and gold: Right Now on warm white under a black rule, By Friday on a flat, quieter gold with white rows numbered 01 to 06.', '', true],
    ['v6', 'Paper and slate, numbered', 'From MK’s white and dark: Right Now on warm white, By Friday on the day cards’ slate in a thin gold frame, rows numbered 01 to 06 in gold squares.', '', true],
    ['v7', 'Warm white and green', 'From MK’s white and green Before / After: Right Now on warm white under a red rule, By Friday on a deeper, quieter green with white rows and dark tick squares.', ''],
    ['v8', 'One frame, a gold divide', 'From MK’s split panel: one slate frame split down the middle by a gold line; Right Now in muted grey, By Friday in gold and white.', ''],
    ['v9', 'Tinted frames', 'From MK’s red and green frames: slate cards in thin red and green frames with a faint wash of the same colour from the top corner instead of a glow.', ''],
    ['v10', 'Header bars', 'From MK’s red and green title bars: slate cards with the label in a solid bar across the top, the colours a step deeper and quieter.', ''],
  ];
  const item = (mk, t) => `<div class="it"><span class="mk">${mk}</span><span>${t}</span></div>`;
  document.querySelector('[data-root]').innerHTML = V.map(([id, name, note, badge, num], k) => `<section class="vsec ${id}" id="${id}">
    <div class="note"><b>${k + 1}</b><span><strong style="color:#fff">${name}.</strong> ${note}</span></div>
    <h2>Your ICT Trading <span class="r">Right Now</span> vs. <span class="g">After The 5-Day Challenge</span></h2>
    <div class="vs">
      <div class="card now"><h3 class="lbl">Right Now</h3>${NOW.map((t) => item(CROSS, t)).join('')}</div>
      <div class="card fri"><h3 class="lbl">By Friday</h3>${FRI.map((t, i) => item(num ? `0${i + 1}` : CHECK, t)).join('')}</div>
      ${badge}
    </div>
    <div class="cta"><a class="btn" href="#">Join the 5 Day Challenge</a><small>Sixty minutes a night.</small></div>
  </section>`).join('');
})();
</script>
</body>
</html>
